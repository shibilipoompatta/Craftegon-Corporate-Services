name: Deploy Craftegon Corporate Services

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Step 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Step 2a: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Step 2b: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 3: Install Dependencies & Compile Tailwind CSS
        run: |
          npm ci
          npm run build:css

      - name: Step 4: Verify Site Integrity & Structured Data Schemas
        run: |
          python verify_site.py

      - name: Step 5: Build Production Sitemap & Robots Configuration
        run: |
          python build_sitemap.py

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v4

      - name: Upload Clean Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Step 6: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
